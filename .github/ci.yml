name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  # ── 1. Lint y auditoría (sin BD, solo PHP) ─────────────────────────────────
  lint:
    name: "Lint & Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          # pdo_sqlite está incluida en php-common — no hace falta paquete extra
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Composer audit (vulnerabilidades)
        run: composer audit

      - name: Syntax check (todos los .php del proyecto)
        run: |
          find . \( -path ./vendor -o -path ./.git \) -prune -o \
            -name '*.php' -print0 | xargs -0 -P4 -n1 php -l

  # ── 2. Tests unitarios (sin BD real) ───────────────────────────────────────
  unit:
    name: "Unit tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: PHPUnit — suite unit
        run: vendor/bin/phpunit --testsuite unit --colors=always

  # ── 3. Tests de seguridad ──────────────────────────────────────────────────
  security:
    name: "Security tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Crear directorio de rate limit (necesario para RateLimiterTest)
        run: mkdir -p storage/ratelimit

      - name: PHPUnit — suite security
        run: vendor/bin/phpunit --testsuite security --colors=always

  # ── 4. Tests de integración con cobertura (SQLite en memoria) ──────────────
  integration:
    name: "Integration tests + coverage"
    runs-on: ubuntu-latest
    needs: [unit, security]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: PHPUnit — suite integration con cobertura
        run: |
          vendor/bin/phpunit \
            --testsuite integration \
            --coverage-clover build/clover.xml \
            --colors=always
        env:
          XDEBUG_MODE: coverage

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-clover
          path: build/clover.xml
          retention-days: 14

  # ── 5. Matriz de compatibilidad PHP 8.1 / 8.2 / 8.3 ───────────────────────
  compat:
    name: "PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - name: "Setup PHP ${{ matrix.php }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Crear directorio de rate limit
        run: mkdir -p storage/ratelimit

      - name: "Suite completa en PHP ${{ matrix.php }}"
        run: vendor/bin/phpunit --colors=always
