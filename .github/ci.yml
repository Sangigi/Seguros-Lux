name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  # ── 1. Lint y auditoría de dependencias (rápido, sin BD) ──────────────────
  lint:
    name: "Lint & Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Composer audit (vulnerabilidades conocidas)
        run: composer audit --no-dev

      - name: Syntax check (todos los .php excepto vendor/)
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -P4 -n1 php -l

  # ── 2. Tests unitarios + seguridad (sin BD externa) ────────────────────────
  unit:
    name: "Tests unitarios y de seguridad"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Tests unitarios
        run: vendor/bin/phpunit --testsuite unit --colors=always

      - name: Tests de seguridad
        run: vendor/bin/phpunit --testsuite security --colors=always

  # ── 3. Tests de integración (SQLite en memoria — sin MySQL externo) ─────────
  integration:
    name: "Tests de integración (SQLite)"
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_sqlite
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Tests de integración con cobertura
        run: |
          vendor/bin/phpunit \
            --testsuite integration \
            --coverage-clover build/clover.xml \
            --colors=always
        env:
          XDEBUG_MODE: coverage

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/clover.xml
          retention-days: 7

  # ── 4. Suite completa en matriz de versiones PHP ───────────────────────────
  matrix:
    name: "PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - name: "Setup PHP ${{ matrix.php-version }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: "PHPUnit completo en PHP ${{ matrix.php-version }}"
        run: vendor/bin/phpunit --colors=always