name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: PHP ${{ matrix.php }} — Tests & Análisis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. PHP + extensiones ─────────────────────────────────────────────────
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, curl, json, redis
          coverage: none        # cobertura solo en el job dedicado (ver abajo)
          ini-values: |
            apc.enabled=0
            apc.enable_cli=0

      # ── 3. Cache de Composer ─────────────────────────────────────────────────
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      # ── 4. Instalar dependencias ─────────────────────────────────────────────
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # ── 5. Auditoría de seguridad de dependencias ────────────────────────────
      - name: Security audit
        run: composer audit --no-dev
        continue-on-error: false

      # ── 6. Verificación de sintaxis PHP ──────────────────────────────────────
      - name: PHP syntax check (lint)
        run: |
          find App Core Database -name "*.php" -print0 \
            | xargs -0 -P4 php -l \
            | grep -v "^No syntax errors" && exit 1 || true

      # ── 7. Tests unitarios ───────────────────────────────────────────────────
      - name: PHPUnit — unit suite
        run: vendor/bin/phpunit --testsuite unit --testdox
        env:
          APP_ENV: testing

      # ── 8. Tests de integración ──────────────────────────────────────────────
      - name: PHPUnit — integration suite
        run: vendor/bin/phpunit --testsuite integration --testdox
        env:
          APP_ENV: testing

      # ── 9. Tests de seguridad ────────────────────────────────────────────────
      - name: PHPUnit — security suite
        run: vendor/bin/phpunit --testsuite security --testdox
        env:
          APP_ENV: testing

      # ── 10. Tests de seguridad ────────────────────────────────────────────────
      - name: PHPUnit — security suite
        run: vendor/bin/phpunit --testsuite controllers --testdox
        env:
          APP_ENV: testing

  # ── Job de cobertura (solo PHP 8.2, no bloquea el merge) ────────────────────
  coverage:
    name: Cobertura de código
    runs-on: ubuntu-latest
    needs: test
    # ELIMINAMOS EL "if: github.event_name == 'push'..." para que valide los Pull Requests.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 + Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite, mbstring, xdebug
          coverage: xdebug
          ini-values: |
            xdebug.mode=coverage
            apc.enabled=0

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.2-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run all suites with coverage
        run: |
          vendor/bin/phpunit \
            --coverage-clover build/coverage.xml \
            --coverage-text
        env:
          APP_ENV: testing

      # NUEVO PASO: Fuerza el fallo si la cobertura es menor al 80%
      - name: Enforce 80% coverage minimum
        run: |
          php -r '
            $xml = simplexml_load_file("build/coverage.xml");
            $metrics = $xml->project->metrics;
            $covered = (int)$metrics["coveredelements"];
            $total = (int)$metrics["elements"];
            $percent = $total > 0 ? ($covered / $total) * 100 : 0;
            printf("Cobertura actual: %.2f%%\n", $percent);
            if ($percent < 80.0) {
              fwrite(STDERR, "❌ La cobertura está por debajo del 80%.\n");
              exit(1);
            }
          '

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage.xml
          retention-days: 14